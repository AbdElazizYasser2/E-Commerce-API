services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-v2-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/ecommerce-v2
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ecommerce-network

  mongo:
    image: mongo:7
    container_name: ecommerce-v2-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

volumes:
  mongo-data:

networks:
  ecommerce-network:
    driver: bridge
